ante e tahine com limão Serve pra quando o corpo precisa de comida de verdade, mas a mente quer uma desculpa pra se desligar do mundo.", ["Abóbora em cubos", "Grão-de-bico cozido", "Páprica defumada, sal, azeite", "Tahine, limão, mel (ou agave), alho"]], ["Coragem suave", "Tofu grelhado com gengibre, shoyu e cebolinha + arroz com gergelim Ideal pra almoços de energia leve e foco. Trilha: algo do Michael Kiwanuka ou Leon Bridges.", ["Tofu firme", "Gengibre ralado", "Shoyu, melado", "Cebolinha", "Arroz branco ou integral", "Gergelim preto"]], ["Silêncio de tarde", "Creme de banana congelada com cacau e canela (sorvete fake) Perfeito pra tardes de tédio com trilha de Mazzy Star. Te dá açúcar e aconchego sem culpa.", ["2 bananas congeladas", "1 colher de cacau em pó", "Canela", "1 colher de pasta de amendoim (opcional)", "Pitada de sal"]], ["Antes de dormir", "Chá de lavanda e camomila com leite vegetal morno e mel Cria um fechamento do dia com ternura. Luz baixa, som de chuva e silêncio.", ["Chá de camomila e lavanda", "Leite vegetal (aveia, amêndoas...)", "Mel ou agave", "Raspinhas de noz-moscada ou canela"]]], "images": ["data:image/webp;base64,UklGRsQmAQBXRUJQVlA4WAoAAAAQAAAAugEAugEAQUxQSAtBAAABHAVt20gxf9jbPRAiYgJaze5fcqGvyroUgpSxLuqq0ulW7pxwQTK8wLamNdu2bcu2xWKx2NjY2NhYLDYWi42NjY2NxWKxWCwWS9UUNA3dQPYc109VREwADWzb61hXdenS0dHR0dFqtVqtVqvVaDQajUaj0Wg0+mmu64EepnNY/94YERPAf+X2gP7Z/neO+Zej/29y/YcD/61z+2dzA/7Z8A8nnqT/aB6T1z8arP9oxp/IUv5R+IUEoLX/ILEt+WXcWGfu/x6VjR/FA9U0rO+XR/PvyU9jBtKyMf80Tcj/GCnwzv5iKbz9/YBiN91ujeWZNo5/2wuQ+VNkUPqJU0nMVp7MIeZmIHXXIyPAtblB/auYCBj+DEyl6P5YZ2BFHwFqdju1sC1bVyiZhfX9r+NvMbusZ+2xlNRfljnO3mBdB6Bj/ptuwFsqgPtfBBo3vC8bnnIOuseOrBDomsvw+ycBxFIE8EdgxcscAS66PgU0CX422B/jxfDzB50mkvR3GNYAGxvonnMISLO+HFim62Aff1A3V/4VWHvCBq4c/m2ACBCan6ZpOOq74n7+IIDP5Axkf4BitafUBaGlL5vUA1LDfClFTuMTdLzx5DQRwB+A9SVCLBbJhh5wknCsJJ1crGN0NK+J/kSBZssMkEIpkHC9aLqE19EAVLbmF5Avk+JYOUxKp0ImUrrg+jFHdLMVQP313XdoWlGC4OaAJL1tw+TDPdMRyZ4AfH1s/bVWCVAiLSiho5Y0ocn5HJj+AufN1S5ZaRxuky6R6rlIEkiRJK const content = document.querySelector('main');
const esc = text => String(text).replace(/[&<>"']/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
const number = index => String(index + 1).padStart(2, '0');
const label = data.menu ? 'Opções' : 'Receitas';
const art = (index, className = 'art') => '<img class="' + className + '" alt="" src="' + data.images[index % data.images.length] + '">';
const entryArt = index => data.menu ? Math.floor(index / 5) : index;
const tabs = selected => '<div class="week-tabs">' + data.sections.map(([start,end], i) => '<a href="#/capitulo/'+(i+1)+'"'+(i===selected?' aria-current="page"':'')+'>'+label+' '+number(start)+'–'+number(end-1)+'</a>').join('')+'</div>';
const crumbs = title => '<div class="crumbs"><a href="#/">Início</a><span>›</span><span>'+esc(title)+'</span></div>';
const card = (entry,index) => '<a class="day-row" href="#/item/'+(index+1)+'"><span class="no">'+number(index)+'</span><span class="weekday">'+(data.menu ? 'Menu' : 'Receita')+'</span><strong>'+esc(entry[0])+'</strong><span class="cal"></span>'+art(entryArt(index),'row-art')+'</a>';
function home() {
    return '<section class="hero"><div><div class="eyebrow">'+data.subtitle+'</div><h1>'+data.title.replace(/ (\S+)$/, '<br>$1')+'.</h1><p>'+data.description+'</p><a class="textlink" href="#/capitulo/1">Abrir o primeiro capítulo</a></div>'+art(0)+'</section><section><div class="section-head"><h2>Quatro capítulos.</h2><a class="textlink" href="#/indice">Ver '+label.toLowerCase()+'</a></div><div class="weeks">'+data.sections.map(([start,end], i)=>'<a class="week-link" href="#/capitulo/'+(i+1)+'"><span class="eyebrow">Capítulo</span><div class="number">'+number(i)+'</div>'+art(entryArt(start),'chapter-art')+'<h3>'+label+' '+number(start)+'–'+number(end-1)+'</h3></a>').join('')+'</div></section>';
}
function index() {
    return crumbs(label)+'<div class="eyebrow">'+data.subtitle+'</div><h1>'+label+' do caderno.</h1>'+tabs(-1)+'<div class="days-list">'+data.entries.map(card).join('')+'</div>';
}
function chapter(index) {
    const [start,end] = data.sections[index];
    return crumbs('Capítulo '+number(index))+tabs(index)+'<section class="hero"><div><div class="eyebrow">Capítulo '+number(index)+'</div><h1>'+label+' '+number(start)+'–'+number(end-1)+'.</h1><a class="textlink" href="#/item/'+(start+1)+'">Ver '+(data.menu?'a primeira opção':'a primeira receita')+'</a></div>'+art(entryArt(start),'chapter-art opening-art')+'</section><div class="days-list">'+data.entries.slice(start,end).map((entry,i)=>card(entry,start+i)).join('')+'</div>';
}
function item(index) {
    const [title, intro, materials] = data.entries[index];
    return crumbs(title)+'<section class="recipe-top"><div class="recipe-header"><div class="eyebrow">'+ (data.menu?'Menu':'Receita '+number(index)) +'</div><h1>'+esc(title)+'</h1>'+(intro?'<p class="intro">'+esc(intro)+'</p>':'')+'<h2>'+(data.menu?'À mesa':'Ingredientes')+'</h2><ul class="entry-detail">'+materials.map(value=>'<li>'+esc(value)+'</li>').join('')+'</ul></div>'+art(entryArt(index))+'</section><div class="prev-next">'+(index>0?'<a href="#/item/'+index+'">Anterior</a>':'<span></span>')+(index+1<data.entries.length?'<a href="#/item/'+(index+2)+'">Próxima</a>':'<a href="#/indice">Voltar ao índice</a>')+'</div>';
}
function render() {
    const [,page,value] = location.hash.replace(/^#/,'').split('/');
    const i = Number(value)-1;
    content.innerHTML = page==='indice' ? index() : page==='capitulo' && data.sections[i] ? chapter(i) : page==='item' && data.entries[i] ? item(i) : home();
    const nav = document.querySelector('nav');
    nav.classList.remove('open');
    document.querySelector('#menu').setAttribute('aria-expanded','false');
    window.scrollTo(0,0);
}
document.querySelector('#menu').addEventListener('click',event=>{
    const expanded = document.querySelector('nav').classList.toggle('open');
    event.currentTarget.setAttribute('aria-expanded',String(expanded));
});
window.addEventListener('hashchange',render);
render();
</script></body></html>
