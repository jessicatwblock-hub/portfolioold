 });
 function update(){
  const query=normalize(search.value.trim());
  let total=0;
  for(const {card,text} of cards){
   const matches=query.split(/\s+/).every(word=>text.includes(word));
   if(matches)total++;
   card.hidden=!matches||(!query&&total>limit);
  }
  more.hidden=Boolean(query)||total<=limit;
  return total;
 }
 more.addEventListener('click',()=>{limit+=12;update()});
 main.append(element);
 update();
 return update;
